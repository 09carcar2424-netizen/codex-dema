services:
  postgres:
    image: postgres:16
    container_name: wp-automation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wp_automation
      POSTGRES_USER: wpauto
      POSTGRES_PASSWORD: wpauto
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  postgres_data:
